<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>Tilt Play — demo</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#0b0b10;--panel2:#14151d;--line:#1e2029;--red:#f20b43;--red2:#b8002c;--blue:#1887ff;--text:#f7f7fb;--muted:#777986;--green:#35d991;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;color:var(--text);font-family:Manrope,Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}
button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#app{width:100%;max-width:592px;height:100dvh;min-height:600px;margin:0 auto;display:flex;flex-direction:column;background:#000;overflow:hidden;position:relative;isolation:isolate}
#chrome{flex:none;background:#000;z-index:3}
#status{height:50px;position:relative;flex:none}
.status-time{position:absolute;left:42px;top:11px;background:#fb3d4b;border-radius:18px;padding:4px 17px 5px;font-weight:800;font-size:14px;line-height:1;letter-spacing:.1px;min-width:87px;text-align:center}
.telegram-pill{position:absolute;left:50%;top:7px;transform:translateX(-50%);height:31px;padding:0 12px;border-radius:17px;background:#2589ef;color:#fff;display:flex;align-items:center;gap:5px;font-weight:800;font-size:12px;letter-spacing:.1px;white-space:nowrap}
.telegram-pill svg{width:17px;height:17px;fill:#fff}
.status-icons{position:absolute;right:27px;top:12px;display:flex;align-items:center;gap:5px;color:#dedfe4;font-size:13px;font-weight:800}
.signal{display:inline-flex;align-items:flex-end;height:14px;gap:2px}.signal i{display:block;width:3px;border-radius:3px;background:#ddd;height:5px}.signal i:nth-child(2){height:8px}.signal i:nth-child(3){height:11px}.signal i:nth-child(4){height:14px;opacity:.35}
.wifi{font-size:17px;line-height:12px;transform:translateY(-1px)}.battery{font-size:11px;background:#d9dde5;color:#111;border-radius:5px;padding:2px 4px;line-height:13px;font-weight:900}
#appbar{height:44px;margin-top:14px;padding:0 22px;display:flex;justify-content:space-between;align-items:center}
.bar-pill{height:43px;border-radius:24px;background:#171719;display:flex;align-items:center;gap:9px;padding:0 14px;font-size:15px;font-weight:700;color:#f2f2f5;letter-spacing:.1px}
.bar-pill .bar-symbol{font-size:26px;font-weight:400;line-height:1;margin-top:-2px}
.bar-right{height:43px;border-radius:24px;background:#171719;padding:0 15px;display:flex;align-items:center;gap:20px;color:#ddd;font-size:20px}
#wallet{height:64px;margin-top:46px;padding:0 18px 0 23px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.wallet-left{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:43px;height:43px;flex:none;border-radius:50%;border:1px solid #143044;background:radial-gradient(circle at 44% 30%,#1c3e4a,#071015 55%,#000);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 10px #5ac8ff22;font-size:23px;overflow:hidden}
.avatar:after{content:'◒';color:#76c6dc;font-size:31px;transform:rotate(-25deg);opacity:.66}
.balance-caption{font-size:12px;color:#777985;line-height:15px;margin-bottom:2px}
.balance-number{font-size:19px;line-height:22px;font-weight:850;letter-spacing:.1px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.diamond{color:#20a9ff;font-size:21px;text-shadow:0 0 7px #1589ff33;line-height:1}
.topup{height:56px;border-radius:31px;padding:0 21px;background:linear-gradient(180deg,#fa0644,#d70036);box-shadow:0 0 26px #ee003b55;color:#fff;display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;white-space:nowrap;flex:none}
.topup svg{width:19px;height:19px}
#ticker{height:96px;margin-top:29px;padding:0 22px;display:none;align-items:center;gap:11px}
#ticker.show{display:flex}
.live-vertical{writing-mode:vertical-rl;transform:rotate(180deg);color:#ff154f;font-size:11px;font-weight:900;letter-spacing:2px;flex:none;position:relative;padding:4px 0}
.live-vertical:before{content:'';display:block;width:5px;height:5px;border-radius:50%;background:#ff154f;position:absolute;top:-12px;left:4px;box-shadow:0 0 8px #ff154f}
.ticker-items{height:90px;display:flex;align-items:center;gap:8px;overflow:hidden;flex:1}
.ticker-item{height:90px;min-width:76px;max-width:96px;border-radius:15px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#121218;border:1px solid #1d1d25;flex:1}
.ticker-item img{width:100%;height:100%;object-fit:cover;display:block}
#main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:none;padding:20px 18px 18px}
#main::-webkit-scrollbar{display:none}
#nav{height:100px;flex:none;display:flex;align-items:stretch;justify-content:space-around;padding:8px 10px calc(13px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#080004,#090004);border:1px solid #210612;border-bottom:0;border-radius:24px 24px 0 0;position:relative;z-index:5;box-shadow:0 -6px 30px #0008}
.nav-item{flex:1;position:relative;background:transparent;color:#7a747c;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;font-size:11px;font-weight:700;padding:3px 0 0;min-width:0}
.nav-item svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active:not(.home-tab){color:#ff164e}.nav-item.active:not(.home-tab):before{content:'';position:absolute;top:-9px;left:17%;right:17%;height:3px;border-radius:0 0 3px 3px;background:#ff164e;box-shadow:0 0 10px #ff164e55}
.nav-item.home-tab{justify-content:flex-end;padding-bottom:0}.home-icon{width:64px;height:57px;border-radius:50%;background:#f20b43;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px #f20b4355;margin-bottom:1px;color:white;flex:none}
.nav-item.home-tab.active:before{content:'';position:absolute;top:-9px;left:19%;right:19%;height:3px;border-radius:3px;background:#ff164e;box-shadow:0 0 10px #ff164e}
.home-icon svg{width:29px;height:29px;stroke:#fff;stroke-width:2}
/* shared components */
.eyebrow{font-size:10px;font-weight:900;letter-spacing:1.8px;color:#ef3158;text-transform:uppercase}
.page-title{font-size:21px;font-weight:900;letter-spacing:-.25px;margin:0 0 12px}
.muted{color:var(--muted)}.tiny{font-size:11px;color:var(--muted)}
.panel{background:#0c0d12;border:1px solid #1a1b24;border-radius:19px;padding:15px;margin:12px 0}
.row{display:flex;align-items:center;gap:8px}.space-between{justify-content:space-between}
.pill{background:#171923;border:1px solid #20222c;color:#dce0e9;border-radius:11px;padding:10px 12px;font-weight:800;font-size:12px}
.pill.active{background:#36101b;border-color:#f11348;color:#fff;box-shadow:inset 0 0 0 1px #f1134818}
.red-btn{background:linear-gradient(180deg,#ff3c48,#bf001e);box-shadow:0 6px 20px #ef123233;border-radius:14px;color:#fff;font-weight:900;letter-spacing:.25px;padding:14px 16px;min-height:49px}
.green-btn{background:linear-gradient(180deg,#4fe8b1,#15b97b);color:#002719;border-radius:14px;font-weight:900;padding:14px 16px;min-height:49px}
.full{width:100%}.red-btn:disabled,.green-btn:disabled{opacity:.45;box-shadow:none}
.input-number{background:#14151d;border:1px solid #252632;border-radius:12px;padding:12px;color:#fff;width:100%;font-weight:850;font-size:18px;outline:none}
.field-label{display:block;text-transform:uppercase;letter-spacing:1.1px;color:#777b89;font-size:10px;font-weight:900;margin-bottom:9px}
.chip-row{display:flex;gap:7px}.chip-row>*{flex:1;min-width:0}
.section-label{font-size:12px;font-weight:900;letter-spacing:1px;color:#a1a3ad;margin:14px 0 10px;text-transform:uppercase}
/* home page */
.home-banners{display:flex;flex-direction:column;gap:14px}
.home-banner{display:block;width:100%;aspect-ratio:3.015/1;border-radius:18px;overflow:hidden;padding:0;background:#160408;border:1px solid #290912;box-shadow:0 6px 17px #6a001522;transition:transform .12s}
.home-banner:active{transform:scale(.985)}.home-banner img{display:block;width:100%;height:100%;object-fit:cover}
.demo-note{text-align:center;margin:12px 0 3px;color:#575862;font-size:10px;letter-spacing:.2px}
/* rocket */
.multiplier-history{display:flex;gap:6px;overflow:hidden;white-space:nowrap;margin:0 0 14px}
.multiplier-history span{padding:6px 8px;border-radius:7px;background:#1c202b;color:#b4a7ff;font-size:10px;font-weight:900;flex:none}
.multiplier-history .low{color:#ff7897}.multiplier-history .high{color:#50e5b4}
.rocket-stage{height:270px;border-radius:22px;background:radial-gradient(ellipse at 50% 85%,#0a2240 0,#05070c 55%,#000 100%);border:1px solid #171b23;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px}
.rocket-stage:before{content:'';position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 26%,#fff7,transparent),radial-gradient(1px 1px at 77% 20%,#56a4ff99,transparent),radial-gradient(1px 1px at 60% 72%,#fff8,transparent),radial-gradient(1px 1px at 30% 64%,#8fd6ff99,transparent);background-size:100px 100px;opacity:.8}
.rocket-ring{position:absolute;width:190px;height:190px;border:8px solid #1c3850;border-top-color:#248dff;border-right-color:#1a7bd0;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 25px #1c8fff19,inset 0 0 20px #278cff08}
.rocket-ring.counting{border-top-color:#29d99a;border-right-color:#29d99a;animation:rotate 2s linear infinite}.rocket-ring.flying{border-color:#27d99b;box-shadow:0 0 27px #25d99b2a}
.rocket-count{font-size:34px;font-weight:900}.rocket-center{display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;gap:7px}.rocket-symbol{font-size:40px;filter:drop-shadow(0 5px 15px #147fff4a);display:none}.rocket-mult{font-size:30px;font-weight:1000;display:none}.rocket-hint{font-size:11px;color:#8b91a0;margin-top:2px}
.rocket-stage.flying .rocket-symbol,.rocket-stage.flying .rocket-mult{display:block}.rocket-stage.flying .rocket-count{display:none}.rocket-stage.crashed{box-shadow:inset 0 0 90px #ff223833}.rocket-stage.crashed .rocket-ring{border-color:#f22d56}.rocket-stage.crashed .rocket-symbol{display:block;opacity:.25;filter:grayscale(1)}
.bet-panel{padding:13px 14px 14px;background:#0c0d12;border:1px solid #1d1e26;border-radius:18px}
.bet-panel .field-label{margin-top:0}.amount-pick{display:flex;gap:7px;margin:8px 0 12px}.amount-pick button{flex:1;padding:10px 4px;border:1px solid #242631;background:#181a24;border-radius:10px;font-weight:900;font-size:12px;color:#a5a7b1}.amount-pick button.selected{background:#3b121d;border-color:#f20b43;color:#fff}
.game-setting{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #1c1d25;padding:12px 0;font-size:12px;color:#898c98}
/* cases */
.case-list{display:flex;flex-direction:column;gap:11px}
.case-card{display:flex;align-items:center;gap:13px;min-height:130px;background:radial-gradient(circle at 90% 15%,#9a002d40,transparent 55%),linear-gradient(115deg,#111219,#09090d);border:1px solid #28202a;border-radius:17px;padding:13px;overflow:hidden;position:relative}
.case-picture{width:99px;height:99px;flex:none;border-radius:14px;overflow:hidden;background:#1e0b13;border:1px solid #3a1422}.case-picture img{width:100%;height:100%;object-fit:cover}
.case-name{font-weight:1000;font-size:15px;text-transform:uppercase;letter-spacing:.3px}.case-sub{font-size:11px;color:#9695a1;margin:4px 0 12px}.case-cost{font-size:12px;color:#fff;border-radius:10px;padding:8px 10px;display:inline-flex;background:#f10d43;font-weight:900}
/* Tilt play hub */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-card{background:radial-gradient(circle at 80% 10%,#f20b4325,transparent 45%),#0d0e14;border:1px solid #29202a;border-radius:17px;padding:13px 10px 14px;min-height:150px;text-align:left;position:relative;overflow:hidden}
.mode-card .mode-art{width:76px;height:76px;display:block;object-fit:cover;border-radius:13px;margin-bottom:11px;box-shadow:0 4px 17px #0007}
.mode-card strong{display:block;font-size:13px;font-weight:1000;letter-spacing:.4px}.mode-card small{display:block;color:#888996;font-size:10px;margin-top:5px}
/* mines */
.mines-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:0 0 11px}
.mine-cell{aspect-ratio:1;background:linear-gradient(145deg,#181a22,#101118);border:1px solid #222530;border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 5px #ffffff04;min-width:0;transition:transform .13s,background .13s}
.mine-cell:active{transform:scale(.93)}.mine-cell.revealed{background:#062b4a;border-color:#147be0;box-shadow:inset 0 0 19px #1186ff24}.mine-cell.bomb{background:#39131b;border-color:#ff335b}
.mine-cell svg{width:27px;height:27px}.mine-cell .diamond-glyph{color:#2da6ff;font-size:26px;text-shadow:0 0 12px #248fff}
.mines-stats{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#818491;font-size:11px}.mini-stat{display:flex;align-items:center;gap:5px;background:#171922;border-radius:9px;padding:7px 9px;color:#d8dbe4;font-weight:800}
/* Upgrade */
.upgrade-ring{width:220px;height:220px;border-radius:50%;margin:5px auto 16px;display:flex;align-items:center;justify-content:center;position:relative;background:conic-gradient(#168bff 0 45.5%,#20222c 45.5% 100%);box-shadow:0 0 20px #087eff12}
.upgrade-ring:before{content:'';position:absolute;inset:13px;border-radius:50%;background:#06070b;border:1px solid #171923}
.upgrade-inner{position:relative;text-align:center;z-index:1}.upgrade-percent{font-weight:1000;font-size:31px}.upgrade-inner small{display:block;color:#818695;font-size:11px;margin-top:3px}
.target-gift{background:#11121a;border:1px solid #29202a;border-radius:15px;padding:11px;display:flex;align-items:center;gap:12px;margin:10px 0 13px;cursor:pointer}
.target-gift img{width:68px;height:68px;border-radius:10px;object-fit:cover;flex:none}.target-gift strong{display:block;font-size:12px}.target-gift small{display:block;font-size:11px;color:#878b98;margin-top:6px}
/* Inventory */
.inventory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gift-card{background:#0b0c11;border:1px solid #22232c;border-radius:18px;overflow:hidden;min-width:0;position:relative}
.gift-picture{position:relative;background:#15151c;line-height:0}.gift-picture img{width:100%;aspect-ratio:1/1;display:block;object-fit:cover}
.gift-value{position:absolute;left:0;right:0;top:9px;text-align:center;font-size:12px;font-weight:1000;color:#e8edf4;text-shadow:0 1px 4px #000}
.gift-name{min-height:43px;padding:8px 7px 9px;text-align:center;font-size:10px;font-weight:900;letter-spacing:.55px;line-height:1.25;overflow-wrap:anywhere}.gift-name:after{content:'';display:block;width:24px;height:3px;border-radius:2px;background:var(--giftcolor,#ff1d50);margin:7px auto 0}
.inventory-empty{text-align:center;padding:46px 18px;color:#808391}.inventory-empty .empty-icon{font-size:40px;margin-bottom:12px}
/* Chicken mode */
.chicken-road{display:flex;gap:5px;align-items:stretch;margin:30px 0 16px;padding-left:0;position:relative}
.road-step{flex:1;min-width:0;height:75px;background:#151720;border:1px solid #222530;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;font-size:9px;font-weight:900;color:#b9bbc5}
.road-step.current{border-color:#ff174c;background:#2d101b}.road-step.safe{background:#092d25;border-color:#1dbf85}.road-step .chicken-emoji{font-size:19px}
/* Ice area board */
.ice-board-wrap{position:relative;width:100%;aspect-ratio:1.008;border-radius:17px;overflow:hidden;border:1px solid #252632;background:#08080b}
.ice-board-img{display:block;width:100%;height:100%;object-fit:cover}
.board-token{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;width:33px;height:33px;border-radius:50%;font-size:21px;background:#ffffff0a;filter:drop-shadow(0 2px 2px #0006);transition:transform .2s}
.board-token.hit{transform:translate(-50%,-50%) scale(1.4);filter:drop-shadow(0 0 9px #fff)}
.board-cross{position:absolute;width:31px;height:31px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 3px #fff4,0 0 15px #fff;transform:translate(-50%,-50%);display:none;pointer-events:none}
.ice-stake{background:#0c0d13;border:1px solid #1c1e28;border-radius:17px;padding:14px;margin-top:14px}.ice-stake .amount-pick{margin:0 0 12px}.ice-stake .amount-pick button{padding:14px 2px;border-radius:13px;font-size:12px}.ice-stake .amount-pick button.selected{background:linear-gradient(180deg,#ef3847,#a8001a);border-color:#ed3c47}
/* sheets/modals */
#modal-root:empty{display:none}.overlay{position:absolute;inset:0;z-index:20;background:#000b;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.sheet{width:100%;max-width:592px;max-height:90%;overflow:auto;border:1px solid #24242c;border-radius:24px 24px 0 0;background:#0b0b10;padding:11px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:slideup .25s cubic-bezier(.2,.9,.3,1)}
.sheet-handle{width:54px;height:5px;border-radius:9px;background:#40414a;margin:0 auto 17px}.sheet-title{text-align:center;font-size:20px;font-weight:950;margin:0 0 15px}.multiplier-options{display:flex;gap:8px;margin:12px 0 17px}.multiplier-options button{flex:1;border:1px solid #2a2930;background:#18171d;border-radius:24px;padding:10px 3px;font-size:12px;font-weight:900;color:#bbb}.multiplier-options button.active{border-color:#858089;background:#312a32;color:#fff}
.gift-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.pick-gift{border:1px solid #27232c;border-radius:16px;overflow:hidden;padding:0;background:#101117;text-align:center}.pick-gift img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.pick-gift span{display:block;font-size:10px;font-weight:900;line-height:1.25;padding:6px 4px 3px;min-height:29px}.pick-gift small{display:block;color:#777e8a;font-size:10px;padding:0 4px 9px}
.prize-hero{text-align:center;padding:7px 0 12px}.prize-hero img{width:142px;height:142px;object-fit:cover;border-radius:19px;display:block;margin:0 auto 10px;box-shadow:0 0 35px #ff25551b}.prize-name{font-size:17px;font-weight:1000}.prize-delta{color:#45e6af;font-weight:1000;font-size:23px;margin:8px 0 15px}.details-rows{border:1px solid #1f2028;border-radius:13px;overflow:hidden;margin:12px 0 14px}.details-row{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;border-top:1px solid #1f2028;font-size:12px}.details-row:first-child{border-top:0}.details-row span{color:#848693}.modal-x{float:right;background:#1a1b23;border-radius:50%;width:30px;height:30px;font-size:19px}
/* rating/tasks/profile */
.leader-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #20212a}.leader-row:last-child{border-bottom:0}.rank{width:25px;text-align:center;color:#9698a4;font-weight:900}.leader-avatar{width:37px;height:37px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#39213a,#151c29);font-size:19px;flex:none}.leader-user{flex:1;min-width:0}.leader-user strong{display:block;font-size:13px}.leader-user small{display:block;color:#777b88;font-size:10px;margin-top:3px}.leader-score{font-weight:900;font-size:13px;white-space:nowrap}.task-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #20212a}.task-row:last-child{border-bottom:0}.task-symbol{width:43px;height:43px;display:flex;align-items:center;justify-content:center;background:#171821;border-radius:13px;font-size:21px;flex:none}.task-text{flex:1;min-width:0}.task-text strong{font-size:12px;display:block}.task-text small{font-size:10px;color:#7b7e8b;display:block;margin-top:4px}.task-row button{padding:10px 12px;min-height:auto;font-size:10px}.profile-card{text-align:center;padding:24px 16px}.profile-avatar{height:85px;width:85px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;background:radial-gradient(circle at 30% 20%,#6b1837,#19101d 65%,#07070a);border:1px solid #70213a;font-size:42px;box-shadow:0 0 25px #ef114022}.profile-name{font-size:22px;font-weight:1000}.profile-id{font-size:11px;color:#717583;margin-top:5px}.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.profile-stat{background:#14151d;border-radius:13px;padding:13px 4px;text-align:center}.profile-stat strong{display:block;font-size:17px}.profile-stat small{display:block;color:#7d808d;font-size:10px;margin-top:4px}

$$('[data-upmode]').forEach(b=>b.onclick=()=>{if(busy)return;upMode=b.dataset.upmode;$$('[data-upmode]').forEach(x=>x.classList.toggle('on',x===b));$('#up-ton').style.display=upMode==='ton'?'':'none';$('#up-nft').style.display=upMode==='nft'?'':'none';refresh();});
$$('[data-upton]').forEach(b=>b.onclick=()=>{if(busy)return;upTon=+b.dataset.upton;$('#up-ton-in').value=upTon;$$('[data-upton]').forEach(x=>x.classList.toggle('selected',x===b));refresh();});
$('#up-ton-in').oninput=e=>{const v=parseFloat(e.target.value);upTon=v>0?Math.round(v*100)/100:0;$$('[data-upton]').forEach(x=>x.classList.toggle('selected',+x.dataset.upton===upTon));refresh();};
$$('[data-upinv]').forEach(b=>b.onclick=()=>{if(busy)return;upNftIdx=+b.dataset.upinv;$$('[data-upinv]').forEach(x=>x.classList.toggle('sel',x===b));refresh();});
const rb=$('#up-rand');if(rb)rb.onclick=()=>{if(busy||!state.inventory.length)return;upNftIdx=Math.floor(Math.random()*state.inventory.length);$$('[data-upinv]').forEach((x,i)=>x.classList.toggle('sel',i===upNftIdx));const el=document.querySelector('[data-upinv].sel');if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'});refresh();};
$('#choose-target').onclick=()=>{if(!busy)openGiftPicker();};
const go=$('#upgrade-go');
go.onclick=()=>{if(busy)return;const c=upCalc();
 if(upMode==='ton'){if(!(c.v>0)){toast('Введи сумму ставки');return;}if(state.balance<c.v){toast('Недостаточно виртуальных жетонов');return;}}
 else if(upNftIdx==null||!state.inventory[upNftIdx]){toast('Выбери NFT из инвентаря');return;}
 busy=true;go.disabled=true;
 const ok=Math.random()<c.p,arc=c.p*360;const a=ok?Math.min(arc-1,1+Math.random()*Math.max(0,arc-2)):Math.min(359,arc+1+Math.random()*Math.max(0,360-arc-2));
 const g=GIFT_BY_ID(selectedTarget);
 if(upMode==='ton')changeBalance(-c.v);else{state.inventory.splice(upNftIdx,1);upNftIdx=null;}
 state.played++;if(ok)addGift(g);save();
 const cr=$('#up-cr'),ring=$('.upgrade-ring');ring.style.boxShadow='';
 cur=Math.floor(cur/360)*360+1440+((360-a)%360);cr.style.transition='transform 3.4s cubic-bezier(.12,.7,.1,1)';cr.style.transform=`rotate(${cur}deg)`;
 later(()=>{ring.style.boxShadow=ok?'0 0 40px #35d991':'0 0 40px #ff5b6b';
  if(ok){burst();later(()=>showPrize(g,c.v,'Апгрейд успешен',()=>render()),700);}
  else{ring.style.animation='shk .45s';toast(upMode==='ton'?'Не повезло · ставка сгорела':'Не повезло · NFT сгорел');later(()=>render(),1300);}},3500);};}
function openGiftPicker(){const root=$('#modal-root'),c=upCalc();const list=[...GIFTS].sort((a,b)=>a.price-b.price);
root.innerHTML=`<div class="overlay" id="gift-overlay"><div class="sheet"><div class="sheet-handle"></div><button class="modal-x" id="picker-close" aria-label="Закрыть">×</button><h2 class="sheet-title">Подарок для апгрейда</h2><button class="pill full" id="pick-rand" style="margin-bottom:12px;padding:12px">🎲 Случайный подарок</button><div class="gift-picker">${list.map(g=>`<button class="pick-gift" data-pick="${g.id}"><img src="${g.img}" alt=""><span>${g.name}</span><small>◆ ${fmtPrice(g.price)}${c.v>0?' · ×'+(g.price/c.v).toFixed(1):''}</small></button>`).join('')}</div></div></div>`;
$('#picker-close').onclick=()=>root.innerHTML='';$('#gift-overlay').onclick=e=>{if(e.target.id==='gift-overlay')root.innerHTML='';};
$('#pick-rand').onclick=()=>{selectedTarget=GIFTS[Math.floor(Math.random()*GIFTS.length)].id;root.innerHTML='';render();};
root.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selectedTarget=b.dataset.pick;root.innerHTML='';render();});}
const CH_RED=`<svg viewBox='0 0 64 64' fill='url(#rg)' stroke='#5c0014' stroke-width='2.5' stroke-linejoin='round'><g class='bd'><ellipse cx='30' cy='34' rx='20' ry='16'/><circle cx='46' cy='22' r='10'/><path d='M44 10l3 5 3-5 2 6' fill='#ffc2cc'/><path d='M55 22l8 3-8 3z' fill='#fff'/><circle cx='49' cy='20' r='2.5' fill='#fff' stroke='none'/><path d='M12 30l-10-6 4 12z'/></g><g stroke='#ffb3c0' stroke-width='4' stroke-linecap='round' fill='none'><path class='l1' d='M26 48v10'/><path class='l2' d='M36 48v10'/></g></svg>`;
function chickenView(){return `<div class="eyebrow">TILT PLAY</div><h1 class="page-title" style="margin-top:5px">CHICKEN ROAD</h1><div class="panel" style="margin-top:16px;text-align:center;background:radial-gradient(circle at 50% 0,#3b1730 0,transparent 60%),#0c0d12"><div style="width:64px;height:64px;margin:10px auto;animation:zm 2.4s ease-in-out infinite">${CH_RED}</div><div style="font-size:12px;color:#898d9a">Пройди как можно дальше</div></div><div class="chicken-road" id="chicken-road"><div class="ck" id="ck">${CH_RED}</div>${Array.from({length:8},(_,i)=>`<div class="road-step" data-step="${i}"><span>${(1.18+i*.24).toFixed(2)}x</span><span class="chicken-emoji">${i===7?'🏁':'◆'}</span></div>`).join('')}</div><div class="bet-panel"><label class="field-label">Ставка</label><div class="amount-pick" id="chicken-bets">${[1,2,5,10].map(n=>`<button data-chbet="${n}" class="${n===selectedBet?'selected':''}">${n} ◆</button>`).join('')}</div><div class="row" style="gap:9px"><button class="red-btn full" id="chicken-go">ИГРАТЬ</button><button class="green-btn full" id="chicken-take" disabled>ЗАБРАТЬ</button></div></div>`;}
function bindChicken(){let bet=selectedBet,step=0,active=false,locked=false,mine=null;$('#chicken-bets').querySelectorAll('[data-chbet]').forEach(b=>b.onclick=()=>{if(active)return;bet=+b.dataset.chbet;selectedBet=bet;$('#chicken-bets').querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));});const go=$('#chicken-go'),take=$('#chicken-take');const ck=$('#ck'),road=$('#chicken-road');const mv=(s,run)=>{const c=road.querySelectorAll('.road-step')[s-1],x=c?c.offsetLeft+c.offsetWidth/2-22:0;ck.classList.toggle('run',!!run);ck.style.transform=`translateX(${x}px)`;if(run)later(()=>ck.classList.remove('run'),460);};mv(0);
 take.onclick=()=>{if(!active||step===0)return;const m=1.18+(step-1)*.24;changeBalance(bet*m);if(m>=2)burst();state.wins++;state.played++;save();active=false;toast('Забрано '+fmt(bet*m)+' ◆');go.textContent='ИГРАТЬ СНОВА';take.disabled=true;later(()=>render(),700);};
 go.onclick=()=>{if(!active){if(locked)return;if(state.balance<bet){toast('Недостаточно виртуальных жетонов');return;}changeBalance(-bet);active=true;step=0;locked=false;mine=null;ck.classList.remove('dead');mv(0);$('#chicken-road').querySelectorAll('.road-step').forEach(x=>x.className='road-step');go.textContent='ИДТИ ДАЛЬШЕ';take.disabled=true;return;}if(locked)return;locked=true;const steps=$('#chicken-road').querySelectorAll('.road-step');const hit=Math.random()<.23;const c=steps[step];if(!c){locked=false;return;}if(hit){active=false;state.played++;save();go.textContent='ИГРАТЬ СНОВА';take.disabled=true;mv(step+1,1);later(()=>{ck.classList.add('dead');c.classList.add('current');c.innerHTML='<span>БУМ</span><span class="chicken-emoji">💥</span>';road.style.animation='shk .45s';toast('Курица сбилась · раунд окончен');},470);later(()=>render(),1500);return;}c.classList.add('safe');c.innerHTML='<span>'+(1.18+step*.24).toFixed(2)+'x</span><span class="chicken-emoji">✓</span>';step++;mv(step,1);take.disabled=false;take.textContent='ЗАБРАТЬ '+fmt(bet*(1.18+(step-1)*.24))+' ◆';if(step>=8){changeBalance(bet*(1.18+(step-1)*.24));state.wins++;state.played++;save();active=false;later(()=>{burst();toast('Путь пройден!');},470);take.disabled=true;later(()=>render(),1700);}else later(()=>{locked=false;},470);};}
let iceSet=[];function icePick(){if(iceSet.length!==7){const seen=new Set(),pool=GIFTS.filter(g=>!seen.has(g.img)&&seen.add(g.img));iceSet=pool.sort(()=>Math.random()-.5).slice(0,7);while(iceSet.length<7)iceSet.push(GIFTS[iceSet.length%GIFTS.length]);}return iceSet;}
function iceShuffle(){iceSet=[];icePick();document.querySelectorAll('.board-token img').forEach((im,i)=>{im.src=iceSet[i].img;});}
const ICE_POS=[[14,20],[43,10],[63,28],[26,60],[22,86],[57,76],[84,30]];
function iceView(){iceSet=[];icePick();return `<div class="ice-board-wrap" id="ice-board-wrap"><img class="ice-board-img" src="${IMG.ice_board}" alt="Игровое поле ICE ARENA"><div class="puck" id="puck"><b></b></div>${ICE_POS.map(([x,y],i)=>`<button class="board-token" style="left:${x}%;top:${y}%" data-token="${i}" aria-label="Подарок"><img alt="" src="${iceSet[i].img}"></button>`).join('')}<div class="board-cross" id="board-cross"></div></div>
 <div class="ice-pick" id="ice-pick"></div>
 <div class="ice-stake"><label class="field-label">СТАВКА</label><div class="amount-pick" id="ice-bets">${[1,2,5,10].map(n=>`<button data-icebet="${n}" class="${n===10?'selected':''}">${n} TON</button>`).join('')}</div><button class="red-btn full" id="ice-go">КРУТИТЬ 10 TON</button><div class="tiny" style="text-align:center;margin-top:8px">Демо-режим · виртуальные жетоны</div></div>`;}
function bindIce(){let bet=10,busy=false,picked=null;const pins=[...document.querySelectorAll('.board-token')],info=$('#ice-pick');
 const showPick=()=>{pins.forEach((p,i)=>p.classList.toggle('pick',i===picked));info.innerHTML=picked==null?'Нажми на подарок на поле, чтобы выбрать цель. Шар остановится на нём — <b>×3.2</b>':`Цель: <b>${iceSet[picked].name}</b> · попадание ×3.2 · шанс ~30%`;};
 pins.forEach((p,i)=>p.onclick=()=>{if(busy)return;picked=picked===i?null:i;showPick();});showPick();
 $('#ice-bets').querySelectorAll('[data-icebet]').forEach(b=>b.onclick=()=>{if(busy)return;bet=+b.dataset.icebet;$('#ice-bets').querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b));$('#ice-go').textContent='КРУТИТЬ '+bet+' TON';});
 $('#ice-go').onclick=()=>{if(busy)return;if(state.balance<bet){toast('Недостаточно виртуальных жетонов');return;}busy=true;changeBalance(-bet);state.played++;
 const board=$('#ice-board-wrap'),c=$('#board-cross'),pk=$('#puck');
 pins.forEach(p=>p.classList.remove('hit'));c.style.display='none';
 const T=pins.map(p=>[parseFloat(p.style.left),parseFloat(p.style.top)]);
 let tg,won,mul;
 if(picked!=null){tg=Math.random()<.3?picked:(()=>{let k;do{k=Math.floor(Math.random()*T.length);}while(k===picked);return k;})();won=tg===picked;mul=3.2;}
 else{tg=Math.floor(Math.random()*T.length);won=Math.random()<.58;mul=1.1+Math.random()*1.4;}
 let px=50,py=-6,vx=(Math.random()-.5)*1.6,vy=2.2+Math.random()*1.2;const path=[];
 for(let f=0;f<1400;f++){px+=vx;py+=vy;if(px<6){px=6;vx=-vx*.88;}if(px>94){px=94;vx=-vx*.88;}if(py<6&&f>20){py=6;vy=-vy*.88;}if(py>94){py=94;vy=-vy*.88;}vx*=.985;vy*=.985;const sp=Math.hypot(vx,vy);
  if(sp<.9&&f>30){vx+=(T[tg][0]-px)*.016;vy+=(T[tg][1]-py)*.016;vx*=.93;vy*=.93;}
  path.push([px,py]);if(f>40&&sp<.03&&Math.hypot(T[tg][0]-px,T[tg][1]-py)<1)break;}
 path.push(T[tg]);
 pk.style.left='50%';pk.style.top='-6%';pk._a=0;hap();
 const finish=()=>{pins[tg].classList.add('hit');c.style.left=T[tg][0]+'%';c.style.top=T[tg][1]+'%';c.style.display='block';
  const payout=won?bet*mul:0;
  if(won){changeBalance(payout);state.wins++;if(mul>=1.8)burst();toast('Демо-выигрыш ×'+mul.toFixed(2));}else toast(picked!=null?'Мимо цели · попробуй ещё':'Раунд завершён · попробуй ещё');
  save();busy=false;$('#ice-go').textContent='КРУТИТЬ '+bet+' TON';
  later(()=>{c.style.display='none';pins.forEach(p=>p.classList.remove('hit'));iceShuffle();picked=null;showPick();},900);};
 const t0=performance.now();let lt=0;
 const anim=()=>{if(!document.body.contains(board))return;const k=Math.max(0,Math.min(path.length-1,Math.floor((performance.now()-t0)/16.7)));pk.style.left=path[k][0]+'%';pk.style.top=path[k][1]+'%';
  {let dd=0;for(let q=Math.max(1,k-1);q<=k;q++)dd+=Math.hypot(path[q][0]-path[q-1][0],path[q][1]-path[q-1][1]);pk._a=(pk._a||0)+dd*(board.offsetWidth/100)/20*57.3;pk.firstChild.style.transform=`rotate(${pk._a}deg)`;}
  if(k-lt>2){lt=k;const d=document.createElement('i');d.style.cssText=`position:absolute;left:${path[k][0]}%;top:${path[k][1]}%;width:22px;height:22px;margin:-11px;border-radius:50%;background:#f20b43;opacity:.5;pointer-events:none;transition:opacity .6s,transform .6s`;board.appendChild(d);requestAnimationFrame(()=>{d.style.opacity=0;d.style.transform='scale(.2)';});setTimeout(()=>d.remove(),650);}
  if(k<path.length-1)requestAnimationFrame(anim);else finish();};
 requestAnimationFrame(anim);};}
function inventoryView(){const items=state.inventory.map((it,i)=>({g:GIFT_BY_ID(it.id),serial:it.serial||i}));return `<h1 class="page-title">Ваши подарки</h1><div class="row space-between" style="margin-bottom:13px"><span class="tiny">NFT-предметы в инвентаре</span><span class="mini-stat">${items.length} шт.</span></div>${items.length?`<div class="inventory-grid">${items.map(({g},i)=>`<button class="gift-card" data-gift-index="${i}" style="--giftcolor:${g.color}"><div class="gift-picture"><img src="${g.img}" alt="${g.name}"><div class="gift-value"><span class="diamond" style="font-size:12px">◆</span> ${fmtPrice(g.price)}</div></div><div class="gift-name">${g.name}</div></button>`).join('')}</div>`:`<div class="inventory-empty"><div class="empty-icon">🎁</div>Пока нет подарков.<br>Открой кейс в демо-режиме.</div>`}`;}
function bindInventory(){document.querySelectorAll('[data-gift-index]').forEach(b=>b.onclick=()=>{const it=state.inventory[+b.dataset.giftIndex];if(it)showPrize(GIFT_BY_ID(it.id),0,'Ваш подарок');});}
function ratingView(){const L=[['Mira','15420','🪩'],['Loki','12180','🦊'],['Alex','9870','⚡'],['Nika','8140','🌙'],['maxi','6062.50','👤'],['Dani','4380','🐸'],['Sofi','3250','💎']];return `<h1 class="page-title">Рейтинг</h1><div class="panel" style="margin-top:16px"><div class="row space-between" style="margin-bottom:7px"><span class="eyebrow">ТОП ИГРОКИ</span><span class="tiny">DEMO</span></div>${L.map((x,i)=>`<div class="leader-row"><div class="rank" style="color:${i<3?'#ffcc57':''}">${String(i+1).padStart(2,'0')}</div><div class="leader-avatar">${x[2]}</div><div class="leader-user"><strong>${x[0]==='maxi'?'Вы':x[0]}</strong><small>${i<3?'Топ игрок':'Участник'}</small></div><div class="leader-score"><span class="diamond" style="font-size:13px">◆</span> ${x[0]==='maxi'?fmt(state.balance):x[1]}</div></div>`).join('')}</div><div class="tiny" style="text-align:center;margin-top:12px">Рейтинг сгенерирован локально для демонстрации</div>`;}
function tasksView(){const tasks=[{id:'play5',title:'Сыграть 5 раундов',desc:'Любой игровой режим',need:5,rew:100,have:Math.min(5,state.played)},{id:'win3',title:'Получить 3 победы',desc:'В демо-режимах',need:3,rew:150,have:Math.min(3,state.wins)},{id:'collect',title:'Собрать 3 подарка',desc:'Открой кейсы или апгрейд',need:3,rew:250,have:Math.min(3,state.inventory.length)}];return `<h1 class="page-title">Задания</h1><div class="panel">${tasks.map(t=>{const done=!!state.tasks[t.id],ready=t.have>=t.need&&!done;return `<div class="task-row"><div class="task-symbol">${t.id==='collect'?'🎁':t.id==='win3'?'🏆':'🎯'}</div><div class="task-text"><strong>${t.title}</strong><small>${t.have}/${t.need} · награда ${t.rew} ◆</small></div><button class="${ready?'green-btn':'pill'}" data-task="${t.id}" ${(!ready&&!done)?'disabled':''}>${done?'ГОТОВО':ready?'ЗАБРАТЬ':'В ПРОЦЕССЕ'}</button></div>`;}).join('')}</div><div class="tiny" style="text-align:center;line-height:1.6">Задания и награды существуют только в локальной демо-версии.</div>`;}
function bindTasks(){document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const id=b.dataset.task;if(state.tasks[id])return;const rewards={play5:100,win3:150,collect:250};state.tasks[id]=true;changeBalance(rewards[id]||0);toast('+'+(rewards[id]||0)+' виртуальных жетонов');render();});}
function profileView(){return `<div class="panel profile-card"><div class="profile-avatar">🌙</div><div class="profile-name">Игрок</div><div class="profile-id">TILT PLAY · DEMO ACCOUNT</div></div><div class="profile-stats"><div class="profile-stat"><strong>${state.played}</strong><small>РАУНДОВ</small></div><div class="profile-stat"><strong>${state.wins}</strong><small>ПОБЕД</small></div><div class="profile-stat"><strong>${state.inventory.length}</strong><small>ПОДАРКОВ</small></div></div><div class="panel" style="margin-top:14px"><div class="row space-between"><span class="muted" style="font-size:12px">Баланс</span><strong><span class="diamond">◆</span> ${fmt(state.balance)}</strong></div><div class="row space-between" style="margin-top:14px"><span class="muted" style="font-size:12px">Сохранение</span><strong style="font-size:12px;color:#4be0a7">Локально</strong></div></div><button class="pill full" id="reset-demo" style="margin-top:4px;padding:13px">СБРОСИТЬ ДЕМО-ПРОГРЕСС</button><div class="tiny" style="text-align:center;line-height:1.6;margin-top:12px">Никакие реальные деньги, подарки или переводы не используются.</div>`;}
function bindProfile(){$('#reset-demo').onclick=()=>{if(confirm('Сбросить демо-баланс и инвентарь?')){state=JSON.parse(JSON.stringify(DEFAULT_STATE));save();stack=[];render();toast('Демо-прогресс сброшен');}};}
function showPrize(g,cost,heading,cb){const root=$('#modal-root');root.innerHTML=`<div class="overlay" id="prize-overlay"><div class="sheet"><div class="sheet-handle"></div><div class="prize-hero"><div class="eyebrow">${heading||'ПРИЗ ПОЛУЧЕН'}</div><h2 class="sheet-title" style="margin-top:8px">NFT отправлен в инвентарь</h2><img src="${g.img}" alt="${g.name}"><div class="prize-name">${g.name}</div><div class="prize-delta">+${fmtPrice(g.price)} ◆</div></div><div class="details-rows"><div class="details-row"><span>Стоимость</span><strong>${fmtPrice(g.price)} ◆</strong></div><div class="details-row"><span>Тип</span><strong>NFT-подарок (демо)</strong></div><div class="details-row"><span>В инвентаре</span><strong>${state.inventory.length} предметов</strong></div></div><button class="red-btn full" id="prize-close">ПОНЯТНО</button></div></div>`;const closeP=()=>{root.innerHTML='';if(cb)cb();};$('#prize-close').onclick=closeP;$('#prize-overlay').onclick=e=>{if(e.target.id==='prize-overlay')closeP();};}
function render(){clearJobs();renderChrome();const main=$('#main');main.innerHTML=({home:homeView,rocket:rocketView,cases:casesView,tilt:tiltView,mines:minesView,upgrade:upgradeView,chicken:chickenView,ice:iceView,inventory:inventoryView,rating:ratingView,tasks:tasksView,profile:profileView}[page]||homeView)();main.scrollTop=0;$('#modal-root').innerHTML='';const bind={home:bindHome,rocket:bindRocket,cases:bindCases,tilt:bindTilt,mines:bindMines,upgrade:bindUpgrade,chicken:bindChicken,ice:bindIce,inventory:bindInventory,rating:()=>{},tasks:bindTasks,profile:bindProfile}[page];if(bind)bind();}
// Match the phone-style time in the reference while keeping it live.
function clock(){const d=new Date();$('#status-time').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',hour12:false});}
clock();setInterval(clock,30000);render();
